<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ExamWatch – Sign in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>

<style>
:root {
  --green: #2E7D32;  --green-deep: #1B5E20;  --green-mid: #4CAF50;
  --green-soft: #A5D6A7;  --green-tint: #E8F5E9;
  --beige: #E6DCC6;  --beige-deep: #C9B895;  --beige-1: #F1E8D8;  --beige-2: #F7F1E7;
  --white: #FAFAF7;  --grey-1: #F2F2ED;  --grey-2: #E5E8E1;
  --blue: #1E3A5F;  --blue-deep: #0F2747;  --blue-mid: #3F5F8A;
  --blue-light: #7C9ABD;  --blue-tint: #D7E3F3;

  --bg: var(--white);
  --circle-1: var(--blue-tint);
  --circle-2: var(--green-tint);
  --card: #fff;
  --card-line: var(--beige);
  --text: var(--blue-deep);
  --muted: var(--blue-mid);
  --input-bg: var(--white);
  --input-line: var(--beige-deep);
  --btn: var(--blue);
  --btn-hover: var(--blue-deep);
  --btn-text: #fff;
  --focus: var(--green-mid);
  --error: #B3261E;

  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--blue-deep);  --circle-1: var(--blue);  --circle-2: #14304F;
    --card: var(--blue);  --card-line: var(--blue-mid);
    --text: var(--white);  --muted: var(--blue-tint);
    --input-bg: var(--blue-deep);  --input-line: var(--blue-mid);
    --btn: var(--green-mid);  --btn-hover: var(--green-soft);  --btn-text: var(--blue-deep);
    --focus: var(--green-soft);  --error: #FFB4AB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: var(--blue-deep);  --circle-1: var(--blue);  --circle-2: #14304F;
  --card: var(--blue);  --card-line: var(--blue-mid);
  --text: var(--white);  --muted: var(--blue-tint);
  --input-bg: var(--blue-deep);  --input-line: var(--blue-mid);
  --btn: var(--green-mid);  --btn-hover: var(--green-soft);  --btn-text: var(--blue-deep);
  --focus: var(--green-soft);  --error: #FFB4AB;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 1rem/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  position: relative; overflow-x: hidden;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

body::before, body::after {
  content: ""; position: fixed; border-radius: 50%; z-index: 0; pointer-events: none;
}
body::before { width: 460px; height: 460px; top: -120px; right: -90px; background: var(--circle-1); }
body::after  { width: 300px; height: 300px; bottom: -110px; left: -70px; background: var(--circle-2); }


.page {
  position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh;
  width: min(1040px, 100% - 2.5rem); margin-inline: auto;
  display: flex; flex-direction: column; padding: clamp(1.5rem, 5vw, 3rem) 0;
}
.brand h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 800; letter-spacing: -0.02em; }
.brand p { margin: .25rem 0 0; color: var(--muted); font-size: .95rem; }
.stage { flex: 1; display: grid; place-items: center; padding: 2rem 0; }

.card {
  width: min(420px, 100%); background: var(--card);
  border: 1px solid var(--card-line); border-radius: 14px;
  padding: clamp(1.75rem, 5vw, 2.5rem);
  box-shadow: 0 10px 30px rgba(15, 39, 71, .08);
}
.card h2 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
.card .sub { margin: .25rem 0 1.75rem; color: var(--muted); font-size: .95rem; }

.field { margin-bottom: 1.25rem; }
.field label { display: block; font-size: .875rem; font-weight: 700; margin-bottom: .4rem; }
.input-wrap { position: relative; }
.field input {
  width: 100%; font: inherit; font-size: .95rem; color: var(--text);
  padding: .8rem 1rem; border-radius: 8px; background: var(--input-bg);
  border: 1.5px solid var(--input-line);
}
.field input::placeholder { color: var(--blue-light); }
.field input:focus { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--green); }
.field input[aria-invalid="true"] { border-color: var(--error); }
.input-wrap input { padding-right: 4.5rem; }
.toggle {
  position: absolute; right: .4rem; top: 50%; transform: translateY(-50%);
  background: none; border: 0; cursor: pointer; padding: .4rem .6rem; border-radius: 6px;
  font: 600 .8rem var(--sans); color: var(--muted);
}
.toggle:hover { color: var(--text); }
.error { color: var(--error); font-size: .85rem; margin-top: .35rem; min-height: 1.2em; }

.row { display: flex; justify-content: space-between; align-items: center; margin: -.25rem 0 1.25rem; font-size: .875rem; }
.row label { display: flex; align-items: center; gap: .5rem; color: var(--muted); cursor: pointer; }
.row input { accent-color: var(--green); width: 1rem; height: 1rem; }
.row a { color: var(--muted); }
.row a:hover { color: var(--text); }

.btn {
  width: 100%; border: 0; cursor: pointer; border-radius: 8px;
  background: var(--btn); color: var(--btn-text);
  font: 700 1rem/1 var(--sans); padding: 1rem;
  transition: background .15s, transform .15s;
}
.btn:hover { background: var(--btn-hover); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .65; cursor: progress; }

.form-msg { margin-top: 1rem; text-align: center; font-size: .9rem; min-height: 1.4em; }
.form-msg.error { color: var(--error); }
.form-msg.ok { color: var(--green); font-weight: 600; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .form-msg.ok { color: var(--green-soft); } }
:root[data-theme="dark"] .form-msg.ok { color: var(--green-soft); }

.foot { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 1.5rem; }

@media (max-width: 520px) {
  body::before { width: 300px; height: 300px; top: -100px; right: -100px; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>

<body>
<div class="page">
  <header class="brand">
    <h1>ExamWatch</h1>
    <p>Real-time student screen monitoring</p>
  </header>

  <main class="stage">
    <section class="card" aria-labelledby="title">
      <h2 id="title">Welcome back</h2>
      <p class="sub">Sign in to continue</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username"
                 placeholder="School email address" aria-describedby="emailErr">
          <p class="error" id="emailErr"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="Enter your password" aria-describedby="passErr">
            <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <p class="error" id="passErr"></p>
        </div>

        <div class="row">
          <label><input type="checkbox" id="remember"> Remember me</label>
          <a href="#" id="forgot">Forgot password?</a>
        </div>

        <button class="btn" type="submit" id="submitBtn">Sign in</button>
        <p class="form-msg" id="formMsg" role="status"></p>
      </form>
    </section>
  </main>
</div>

<script>
const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const pass = document.getElementById("password");
const emailErr = document.getElementById("emailErr");
const passErr = document.getElementById("passErr");
const formMsg = document.getElementById("formMsg");
const btn = document.getElementById("submitBtn");
const loginIssue = new URLSearchParams(window.location.search).get("error");
if (loginIssue === "teacher-access") {
  formMsg.className = "form-msg error";
  formMsg.textContent = "This account does not have teacher/admin access. Ask the project owner to update its role.";
} else if (loginIssue === "connection") {
  formMsg.className = "form-msg error";
  formMsg.textContent = "Could not connect to ExamWatch. Check your internet connection and try again.";
}

const toggle = document.getElementById("toggle");
toggle.addEventListener("click", () => {
  const show = pass.type === "password";
  pass.type = show ? "text" : "password";
  toggle.textContent = show ? "Hide" : "Show";
  toggle.setAttribute("aria-pressed", show);
  toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
});

function setError(input, el, text) {
  el.textContent = text;
  input.setAttribute("aria-invalid", text ? "true" : "false");
}

function validate() {
  let ok = true;
  const v = email.value.trim();
  if (!v) { setError(email, emailErr, "Enter your email."); ok = false; }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { setError(email, emailErr, "Enter a valid school email address."); ok = false; }
  else setError(email, emailErr, "");

  if (!pass.value) { setError(pass, passErr, "Enter your password."); ok = false; }
  else if (pass.value.length < 6) { setError(pass, passErr, "Password must be at least 6 characters."); ok = false; }
  else setError(pass, passErr, "");
  return ok;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  formMsg.className = "form-msg";
  formMsg.textContent = "";
  if (!validate()) return;

  btn.disabled = true;
  btn.textContent = "Signing in…";

  let signedInUserId = null;
  try {
    const { data: authData, error: authError } = await window.examwatchSupabase.auth.signInWithPassword({
      email: email.value.trim(),
      password: pass.value
    });
    if (authError) throw authError;
    signedInUserId = authData.user.id;

    const { data: profile, error: profileError } = await window.examwatchSupabase
      .from("profiles")
      .select("role")
      .eq("id", signedInUserId)
      .single();
    if (profileError) throw profileError;

    formMsg.className = "form-msg ok";
    formMsg.textContent = "Signed in. Redirecting…";
    const isTeacher = profile.role === "admin" || profile.role === "teacher";
    window.location.replace(isTeacher ? "Teacher Side/Admin.html" : "Student Side/Exam.html");
  } catch (err) {
    console.error("[ExamWatch] Sign-in failed.", err);
    if (signedInUserId) {
      const { error: signOutError } = await window.examwatchSupabase.auth.signOut();
      if (signOutError) console.error("[ExamWatch] Could not clear incomplete sign-in.", signOutError);
    }
    formMsg.className = "form-msg error";
    formMsg.textContent = "Sign-in failed. Check your email and password, or contact your administrator.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});

email.addEventListener("input", () => setError(email, emailErr, ""));
pass.addEventListener("input", () => setError(pass, passErr, ""));

document.getElementById("forgot").addEventListener("click", (e) => {
  e.preventDefault();
  formMsg.className = "form-msg";
  formMsg.textContent = "Ask your administrator to create your account or reset your password.";
});
</script>
</body>
</html>
